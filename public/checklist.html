<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/lists.css?v=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  .what { font-size: 15px; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .res button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-weight: 700; cursor: pointer; }
  .res button.on.ok { background: var(--good); color: #062; border-color: var(--good); }
  .res button.on.issue { background: var(--bad); color: #fff; border-color: var(--bad); }
  .res button.on.na { background: var(--muted); color: #111; border-color: var(--muted); }
  .note { margin-top: 6px; min-height: 40px; }
  .rm { background: none; border: 0; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 6px 0 0; }
  .sum { font-size: 14px; color: var(--muted); }
  .saving { font-size: 12px; color: var(--muted); min-height: 1em; }
  .pics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pics a { display: block; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--panel2); }
  .pics img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rowacts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .rowacts .btn { flex: 1 1 120px; min-height: 40px; padding: 4px 8px; font-size: 13px; }
  .who { background: none; border: 0; color: var(--text); font: inherit; font-weight: 700; padding: 0; cursor: pointer; text-align: left; }
  .warn { color: var(--warn); font-size: 13px; min-height: 1em; margin: 4px 0 0; }
</style>
<script src="/offline.js"></script>
</head>
<body>
<header>
  <div class="top">
    <a class="btn" href="/" aria-label="Back to the board">&larr; Board</a>
    <h1 id="ttl">Checklist</h1>
  </div>
  <div class="saving" id="saving" aria-live="polite"></div>
</header>
<main id="main"><p class="empty">Loading...</p></main>
<dialog id="addDlg">
  <form method="dialog" onsubmit="return false">
    <h3>Add a check</h3>
    <div class="row2">
      <div><label for="aPerson">Person (full name)</label><input id="aPerson" maxlength="80" list="people" autocomplete="off" placeholder="First and last name"></div>
      <div><label for="aDate">Date</label><input id="aDate" type="date"></div>
    </div>
    <p class="warn" id="aWarn"></p>
    <label for="aWhat">What to look for</label><input id="aWhat" maxlength="300">
    <p class="err" id="aErr"></p>
    <div class="dacts"><button class="btn" type="button" id="aCancel">Cancel</button><button class="btn primary" type="button" id="aSave">Add</button></div>
  </form>
</dialog>
<datalist id="people"></datalist>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  var id = parseInt(new URLSearchParams(location.search).get("id"), 10) || 0;
  var item = null, rows = [], timer = null, people = [], camRow = null;
  var LABEL = { ok: "✓ OK", issue: "✗ Issue", na: "N/A" };
  function $(x) { return document.getElementById(x); }
  function el(t, c, s) { var e = document.createElement(t); if (c) e.className = c; if (s != null) e.textContent = s; return e; }
  function fmtDate(s) { if (!s) return ""; var d = new Date(String(s).slice(0, 10) + "T12:00:00Z"); return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); }
  function toast(m) { var t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = "none"; }, 2600); }
  async function post(body) {
    var r = await fetch("/api/update", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { var t = "Error " + r.status; try { var j = await r.json(); if (j.error) t = j.error; } catch (e) {} throw new Error(t); }
    return r.json();
  }
  async function load() {
    if (!id) { $("main").textContent = ""; $("main").appendChild(el("p", "empty", "No checklist chosen. Open one from the board.")); return; }
    try {
      var r = await fetch("/api/lists?checklist=" + id);
      if (!r.ok) throw new Error(r.status === 404 ? "item #" + id + " not found" : "error " + r.status);
      var j = await r.json(); item = j.item; rows = Array.isArray(item.checklist_rows) ? item.checklist_rows : [];
      people = j.people || []; var dl = $("people"); dl.textContent = ""; people.forEach(function (p) { var o = el("option"); o.value = p; dl.appendChild(o); });
      render();
    } catch (e) { $("main").textContent = ""; $("main").appendChild(el("p", "empty", "Could not load the checklist: " + e.message)); }
  }
  // Offline mode: once queued changes are sent, reload (unless a save is still waiting to go).
  window.addEventListener("hcc-synced", function () { if ($("saving").textContent !== "Saving...") load(); });
  // Every change saves the whole list after a short pause.
  function save() {
    $("saving").textContent = "Saving...";
    clearTimeout(timer);
    timer = setTimeout(async function () {
      try { await post({ action: "checklist_save", id: id, rows: rows }); $("saving").textContent = "Saved"; }
      catch (e) { $("saving").textContent = "NOT saved: " + e.message + ". Tap any result again to retry."; }
    }, 500);
  }
  async function saveNow() {
    clearTimeout(timer); $("saving").textContent = "Saving...";
    await post({ action: "checklist_save", id: id, rows: rows }); $("saving").textContent = "Saved";
  }
  // Full names only (Mario, 27 Oct 2026): a single word gets a warning and a full-name suggestion.
  function nameWarning(v) {
    v = String(v || "").trim(); if (!v || / /.test(v)) return "";
    var hit = people.filter(function (p) { return p.toLowerCase().indexOf(v.toLowerCase() + " ") === 0; });
    return "Use their full name (first and last)" + (hit.length ? ". Did you mean " + hit.slice(0, 3).join(" or ") + "?" : ".");
  }
  // Photos: shrink on the phone (longest side 1600 px, JPEG) so uploads are quick on site data.
  async function shrink(file) {
    var img;
    try { img = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) { img = await new Promise(function (ok, bad) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = bad; i.src = URL.createObjectURL(file); }); }
    var w = img.width, h = img.height, k = Math.min(1, 1600 / Math.max(w, h));
    var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  }
  async function sendPhoto(body) {
    var res = await fetch("/api/photos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { var t = "Error " + res.status; try { var e = await res.json(); if (e.error) t = e.error; } catch (x) {} throw new Error(t); }
    return res.json();
  }
  // Photos taken before Drive was connected (or when it failed) can be copied over later.
  async function copyToDrive(r) {
    var todo = (r.photos || []).filter(function (ph) { return !ph.drive_id; }), done = 0, err = "";
    $("saving").textContent = "Copying " + todo.length + " photo(s) to Drive...";
    for (var k = 0; k < todo.length; k++) {
      try { var o = await sendPhoto({ item_id: id, retry_key: todo[k].key, person: r.person, date: r.date, look_for: r.look_for }); if (o.drive_id) { todo[k].drive_id = o.drive_id; done++; } else err = o.drive_error; }
      catch (e) { err = e.message; }
    }
    if (done) await saveNow();
    render();
    $("saving").textContent = done + " of " + todo.length + " copied to Drive" + (err ? ". Problem: " + err : "");
  }
  $("cam").onchange = async function () {
    var f = $("cam").files[0], r = camRow; $("cam").value = ""; if (!f || !r) return;
    $("saving").textContent = "Uploading photo...";
    try {
      var data = await shrink(f);
      var ph = await sendPhoto({ item_id: id, data: data, person: r.person, date: r.date, look_for: r.look_for });
      var err = ph.drive_error; delete ph.drive_error;
      r.photos = (r.photos || []).concat([ph]);
      await saveNow(); render();
      if (ph.queued) { delete ph.queued; $("saving").textContent = "No signal: photo saved on the phone. It uploads to Drive when you have signal."; toast("Saved on phone"); }
      else if (ph.drive_id) toast("Photo saved to Drive"); else { $("saving").textContent = "Photo saved in the app but NOT in Drive: " + err + ". Tap Copy to Drive later."; toast("Saved in app, not in Drive"); }
    } catch (e) { $("saving").textContent = "Photo NOT saved: " + e.message + ". Try again."; }
  };
  function render() {
    var m = $("main"); m.textContent = "";
    $("ttl").textContent = "Checklist #" + item.id;
    var head = el("div", "card"); head.appendChild(el("div", "what", item.text));
    var done = rows.filter(function (r) { return r.result; }).length, iss = rows.filter(function (r) { return r.result === "issue"; }).length;
    var meta = el("div", "meta"); meta.appendChild(el("span", null, item.project));
    if (item.due_on) meta.appendChild(el("span", "badge soon", "Due " + fmtDate(item.due_on)));
    if (item.done) meta.appendChild(el("span", "badge ok", "TICKED OFF"));
    head.appendChild(meta);
    head.appendChild(el("p", "sum", done + " of " + rows.length + " checked" + (iss ? ", " + iss + " with an issue" : "")));
    m.appendChild(head);
    if (!rows.length) m.appendChild(el("p", "empty", "No checks yet. Tap Add a check."));
    rows.forEach(function (r, n) {
      var c = el("div", "card");
      var mt = el("div", "meta");
      var wb = el("button", "who", r.person || "Add person"); wb.type = "button"; wb.title = "Change the name";
      wb.onclick = function () {
        var v = prompt("Full name (first and last):", r.person || ""); if (v == null) return; v = v.trim();
        var w = nameWarning(v); if (w && !confirm(w + "\n\nSave \"" + v + "\" anyway?")) return;
        r.person = v; save(); render();
      };
      mt.appendChild(wb); if (r.date) mt.appendChild(el("span", null, fmtDate(r.date)));
      if (nameWarning(r.person)) mt.appendChild(el("span", "badge issue", "FULL NAME?"));
      c.appendChild(mt);
      c.appendChild(el("div", "what", r.look_for));
      var g = el("div", "res"); g.setAttribute("role", "group"); g.setAttribute("aria-label", "Result");
      ["ok", "issue", "na"].forEach(function (k) {
        var b = el("button", k + (r.result === k ? " on" : ""), LABEL[k]); b.type = "button"; b.setAttribute("aria-pressed", r.result === k);
        b.onclick = function () { r.result = r.result === k ? "" : k; save(); render(); }; g.appendChild(b);
      });
      c.appendChild(g);
      var note = el("input", "note"); note.placeholder = "Note (what you found)"; note.maxLength = 300; note.value = r.note || "";
      note.setAttribute("aria-label", "Note"); note.oninput = function () { r.note = note.value; save(); }; c.appendChild(note);
      if (r.photos && r.photos.length) {
        var pics = el("div", "pics");
        r.photos.forEach(function (ph, k) { var a = el("a"); a.href = ph.drive_id ? "https://drive.google.com/file/d/" + encodeURIComponent(ph.drive_id) + "/view" : "/api/photos?key=" + encodeURIComponent(ph.key); a.target = "_blank"; a.rel = "noopener"; a.setAttribute("aria-label", "Photo " + (k + 1)); var im = el("img"); im.src = "/api/photos?key=" + encodeURIComponent(ph.key); im.alt = "Photo " + (k + 1); im.loading = "lazy"; a.appendChild(im); pics.appendChild(a); });
        c.appendChild(pics);
      }
      var ra = el("div", "rowacts");
      var cb = el("button", "btn", "\ud83d\udcf7 Take photo" + (r.photos && r.photos.length ? " (" + r.photos.length + ")" : "")); cb.type = "button";
      cb.onclick = function () { camRow = r; $("cam").click(); }; ra.appendChild(cb);
      var notIn = (r.photos || []).filter(function (ph) { return !ph.drive_id && String(ph.key).indexOf("pending/") !== 0; }).length;
      if (notIn) { var cd = el("button", "btn", "Copy to Drive (" + notIn + ")"); cd.type = "button"; cd.onclick = function () { copyToDrive(r); }; ra.appendChild(cd); }
      c.appendChild(ra);
      var rm = el("button", "rm", "Remove this check"); rm.type = "button";
      rm.onclick = function () { if (confirm("Remove this check?")) { rows.splice(n, 1); save(); render(); } }; c.appendChild(rm);
      m.appendChild(c);
    });
    var acts = el("div", "acts");
    var add = el("button", "btn", "+ Add a check"); add.type = "button"; add.onclick = openAdd; acts.appendChild(add);
    if (!item.done && rows.length && done === rows.length) {
      var fin = el("button", "btn primary", "All checked: tick off #" + item.id); fin.type = "button";
      fin.onclick = async function () {
        try { await post({ action: "item_done", id: id, done: true, answer: iss ? iss + " issue(s) found; see checklist #" + id : "" }); toast("Ticked off"); await load(); }
        catch (e) { toast("Not saved: " + e.message); }
      };
      acts.appendChild(fin);
    }
    m.appendChild(acts);
  }
  function openAdd() { $("aPerson").value = ""; $("aDate").value = ""; $("aWhat").value = ""; $("aErr").textContent = ""; $("aWarn").textContent = ""; $("addDlg").showModal(); }
  $("aPerson").oninput = function () { $("aWarn").textContent = nameWarning($("aPerson").value); };
  $("aCancel").onclick = function () { $("addDlg").close(); };
  $("aSave").onclick = function () {
    var r = { person: $("aPerson").value.trim(), date: $("aDate").value, look_for: $("aWhat").value.trim(), result: "", note: "", photos: [] };
    if (!r.look_for) { $("aErr").textContent = "Say what to look for."; return; }
    var w = nameWarning(r.person); if (w && !confirm(w + "\n\nAdd \"" + r.person + "\" anyway?")) return;
    rows.push(r); $("addDlg").close(); save(); render();
  };
  load();
})();
</script>
</body>
</html>
